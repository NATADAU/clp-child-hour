<script>
(function(){
'use strict';
/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=1)=>(n==null||isNaN(n))?'—':n.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>(n==null||isNaN(n))?'—':n.toLocaleString('ru-RU',{maximumFractionDigits:0})+' ₽';
const keyOf=(y,m)=>y+'-'+String(m).padStart(2,'0');
const MS=[];for(let i=0;i<10;i++){MS.push(keyOf(i<4?2025:2026,(8+i)%12+1));}
const EXCLUDED_MONTH='2025-10'; // Октябрь 2025 исключён: нет корректного детского табеля
const RU_FULL=['','Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const RU_SHORT=['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const mFull=k=>{const [y,m]=k.split('-');return RU_FULL[+m]+' '+y};
const mShort=k=>{const [y,m]=k.split('-');return RU_SHORT[+m]+' '+y.slice(2)};
const MSTEM=[['январ',1],['феврал',2],['март',3],['апрел',4],['ма',5],['июн',6],['июл',7],['август',8],['сентябр',9],['октябр',10],['ноябр',11],['декабр',12]];
function serial(v){const d=new Date(Math.round((v-25569)*864e5));return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()}}
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return {y:v.getUTCFullYear(),m:v.getUTCMonth()+1,d:v.getUTCDate()};
  if(typeof v==='number')return (v>30000&&v<80000)?serial(v):null;
  const s=String(v).trim();let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(m)return {y:+m[3],m:+m[2],d:+m[1]};
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return {y:+m[1],m:+m[2],d:+m[3]};
  return null;
}
function parseMonth(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'||v instanceof Date){const d=parseDate(v);return d?keyOf(d.y,d.m):null}
  const s=String(v).toLowerCase().trim();
  let m=s.match(/(январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр)[а-я]*\.?\s*(\d{4})/);
  if(m){const st=MSTEM.find(x=>m[1].startsWith(x[0]));return keyOf(+m[2],st[1])}
  m=s.match(/^(\d{1,2})[.\/-](\d{4})$/);if(m)return keyOf(+m[2],+m[1]);
  m=s.match(/^(\d{4})-(\d{2})(?:-\d{2})?$/);if(m)return keyOf(+m[1],+m[2]);
  m=s.match(/^\d{1,2}\.(\d{1,2})\.(\d{4})$/);if(m)return keyOf(+m[2],+m[1]);
  return null;
}
function monthFromName(n){const m=String(n).match(/(\d{2})[.\-_](\d{4})/);return m?keyOf(+m[2],+m[1]):null}
const num=v=>{if(typeof v==='number')return isFinite(v)?v:null;if(v==null)return null;const s=String(v).replace(/[\s ]/g,'').replace(',','.');if(s===''||!/^-?\d+(\.\d+)?$/.test(s))return null;return parseFloat(s)};
const normH=v=>String(v==null?'':v).toLowerCase().replace(/\s+/g,' ').trim();
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,4200)}

/* ---------- коды групп ---------- */
const L2C={A:'А',B:'В',C:'С',E:'Е',H:'Н',K:'К',M:'М',O:'О',P:'Р',T:'Т',X:'Х',Y:'У'};
function normCode(c){
  if(c==null)return '';
  let s=typeof c==='number'?String(c).padStart(2,'0'):String(c).trim();
  s=s.replace(/\s+/g,'').toUpperCase().replace(/[–—]/g,'-').replace(/[ABCEHKMOPTXY]/g,x=>L2C[x]);
  if(/^\d$/.test(s))s='0'+s;
  if(/^16[-_]?МЛ$/.test(s))s='16';
  return s;
}
function classify(g){
  if(g==='')return 'empty';
  if(/^0?5(?!\d)/.test(g))return 'g05';
  if(g==='П')return 'primary';
  if(/^ОК\.?ПЕД/.test(g))return 'okped';
  if(/^11(?!\d)/.test(g))return 'amb';
  return 'regular';
}
const CLS_NAME={g05:'Группы 05 и 05.1',primary:'П — первичный приём',okped:'ОК.ПЕД. — околопедагогическая работа',amb:'11 — амбулатория',empty:'Без кода группы'};

/* ---------- ФИО ---------- */
const nk=s=>String(s==null?'':s).toLowerCase().replace(/ё/g,'е').replace(/[\s. ]+/g,'');
function initials(s){
  const m=String(s).trim().match(/^([А-ЯЁа-яё\-]+)\s+([А-ЯЁ][а-яё]+)\s+([А-ЯЁ][а-яё]+)$/);
  return m?m[1]+' '+m[2][0]+'.'+m[3][0]+'.':s;
}
const ALIASES=[
  ['Вандышева А. А.','Вандышева (Коломыцева) А. А.','Коломыцева А. А. (Вандышева)'],
  ['Гаева В. А.','Гаева В. А. (Савина В. А.)'],
  ['Новичкова Д. С.','Новичкова Д.'],
  ['Питрюк М. А.','Питрюк М.'],
  ['Семенюк О. И.','Семенюк О.И.'],
  ['Дикова В. Б. (Криворог Е.)','Криворог Е. Ю.']
];
const ALIAS=new Map();ALIASES.forEach(g=>g.forEach(v=>ALIAS.set(nk(v),nk(g[0]))));
const canon=name=>{const k=nk(initials(name));return ALIAS.get(k)||k};
let SEP=new Set(['БК','32']);try{const j=localStorage.getItem('cch-sep');if(j)SEP=new Set(JSON.parse(j))}catch(e){}
const saveSep=()=>{try{localStorage.setItem('cch-sep',JSON.stringify([...SEP]))}catch(e){}};
let MANUAL={};try{MANUAL=JSON.parse(localStorage.getItem('cch-manual')||'{}')}catch(e){}
const saveManual=()=>{try{localStorage.setItem('cch-manual',JSON.stringify(MANUAL))}catch(e){}};
const repKey=name=>{const c=canon(name);return MANUAL[c]||c};
// Волонтёры: отсутствие начислений ожидаемо и не является ошибкой.
const isVolunteer=(key,name)=>{const k=canon(name||key),v=String(key||'');return k==='битоваал'||k.startsWith('колонин')||k.startsWith('тепелин')||k.startsWith('сохор')||v==='битоваал'};
const NON_CHILD_GROUPS=new Set(['32']);
// Группа 32 — не детская, начисления по ней не обязательны. Романова Т. А. не исключается из проверок.

/* ---------- состояние ---------- */
const S={tabel:{},report:{},payroll:{},leaders:{},opts:{subRG:true},tab:'cost',flt:{m:'',g:'',q:'',nopay:false},pending:null,payrollOut:[],period:'all'};

/* ---------- разбор файлов ---------- */
function sheetsOf(buf){
  const wb=XLSX.read(buf,{type:'array'});
  return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:true})}));
}
function detectKind(rows){
  const flat=rows.slice(0,60).map(r=>r.map(normH));
  if(flat.some(r=>r.includes('фио специалиста'))&&flat.some(r=>r.some(c=>c.startsWith('минут занятия'))))return 'report';
  if(flat.some(r=>r[0]==='фамилия имя'))return 'tabel';
  if(flat.some(r=>r[1]==='код группы')&&flat.some(r=>r.some(c=>c.includes('руководител'))))return 'leaders';
  return null;
}
function parseTabel(rows,fname){
  const hi=rows.findIndex(r=>normH(r[0])==='фамилия имя');
  if(hi<0)throw new Error('Не найдена строка заголовка «Фамилия Имя»');
  const hdr=rows[hi];let mk=null;
  for(let i=0;i<hi&&!mk;i++){const r=rows[i];const j=r.findIndex(c=>normH(c)==='месяц');if(j>=0)mk=parseMonth(r[j+1])}
  if(!mk)mk=monthFromName(fname);
  if(!mk)throw new Error('Не удалось определить месяц табеля');
  const up=hi>0?rows[hi-1].map(c=>String(c==null?'':c).trim().toUpperCase()):[];
  const rgCol=up.indexOf('РГ'),totCol=up.indexOf('ИТОГО');
  const days=[];hdr.forEach((c,i)=>{if(i>=2&&/^\d{1,2}$/.test(String(c).trim())&&(rgCol<0||i<rgCol))days.push(i)});
  const out=[];let control=null,bad={noName:0,noGroup:0};
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];if(!r||r.every(c=>c==null))continue;
    if(/^всего/i.test(String(r[0]||'').trim())){if(totCol>=0)control=num(r[totCol]);break}
    const child=String(r[0]==null?'':r[0]).trim();
    if(!child){bad.noName++;continue}
    const gRaw=r[1]==null?'':String(r[1]).trim();
    if(!gRaw)bad.noGroup++;
    let ds=0;days.forEach(j=>{const v=num(r[j]);if(v)ds+=v});
    const rg=rgCol>=0?(num(r[rgCol])||0):0;
    const tot=totCol>=0&&num(r[totCol])!=null?num(r[totCol]):ds-rg;
    out.push({child,group:normCode(gRaw),ds,rg,tot});
  }
  return {month:mk,rows:out,control,bad,fileName:fname};
}
function parseReport(rows,fname){
  const hi=rows.findIndex(r=>r.some(c=>normH(c)==='фио специалиста'));
  if(hi<0)throw new Error('Не найдена колонка «ФИО специалиста»');
  const h=rows[hi].map(normH);const ix=n=>h.findIndex(c=>c===n||c.startsWith(n));
  const C={type:ix('тип занятия'),date:ix('дата занятия'),code:ix('код группы'),child:ix('фи ребенка'),fact:ix('минут занятия (факт)'),hours:h.indexOf('часы'),fio:ix('фио специалиста'),reason:ix('причина отсутствия')};
  for(const k of ['date','code','fact','fio'])if(C[k]<0)throw new Error('Не найдена колонка отчёта: '+k);
  const raw=[];let control=null;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];if(!r||r.every(c=>c==null))continue;
    if(r.some(c=>/^всего минут/i.test(String(c||'').trim()))){control={fact:num(r[C.fact]),hours:C.hours>=0?num(r[C.hours]):null};continue}
    if(r.some(c=>/^всего часов/i.test(String(c||'').trim())))continue;
    raw.push({r,i});
  }
  const cnt={};const rowsOut=[];const bad={noDate:0,noFio:0,noCode:0,noHours:0,noType:0};
  for(const {r} of raw){
    const d=parseDate(r[C.date]);
    if(!d){if(r[C.fio]!=null||r[C.type]!=null)bad.noDate++;continue}
    const k=keyOf(d.y,d.m);cnt[k]=(cnt[k]||0)+1;
    const fact=num(r[C.fact]);let hrs=C.hours>=0?num(r[C.hours]):null;
    if(hrs==null&&fact!=null){hrs=fact/60;bad.noHours++}
    const fio=String(r[C.fio]==null?'':r[C.fio]).trim();const code=normCode(r[C.code]);const type=String(r[C.type]==null?'':r[C.type]).trim().toUpperCase();
    if(!fio)bad.noFio++;if(!code)bad.noCode++;if(!type)bad.noType++;
    rowsOut.push({k,fio,code,type,hrs:hrs||0,fact:fact||0,reason:C.reason>=0?r[C.reason]:null});
  }
  let mk=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||monthFromName(fname);
  if(!mk)throw new Error('В отчёте нет строк с датами');
  const inM=rowsOut.filter(x=>x.k===mk),out=rowsOut.length-inM.length;
  return {month:mk,rows:inM,outOfMonth:out,control,sumFact:rowsOut.reduce((a,x)=>a+x.fact,0),bad,fileName:fname};
}
function parseLeaders(rows,fname){
  const hi=rows.findIndex(r=>normH(r[1])==='код группы');
  if(hi<0)throw new Error('Не найдена строка «Код группы»');
  const codes=rows[hi];let ln=-1,best=0;
  for(let k=hi-1;k>=0;k--){const c=rows[k].filter((v,j)=>j>=4&&typeof v==='string'&&v.trim()).length;if(c>best){best=c;ln=k}}
  if(ln<0)throw new Error('Не найдена строка с ФИО руководителей групп');
  let mk=null;for(let i=0;i<hi&&!mk;i++)for(const c of rows[i])if(typeof c==='string'&&!mk)mk=parseMonth(c);
  if(!mk)mk=monthFromName(fname);
  const map={};
  for(let j=4;j<codes.length;j++){
    const code=normCode(codes[j]);if(!code||classify(code)!=='regular')continue;
    const nm=String(rows[ln][j]==null?'':rows[ln][j]).replace(/\s+/g,' ').trim();
    if(!/[А-ЯЁа-яё]\./.test(nm))continue;
    map[code]=nm;
  }
  if(!Object.keys(map).length)throw new Error('Руководители групп не найдены');
  return {month:mk,map,fileName:fname};
}
function toMoney(v){return num(v)}
function parsePayroll(sheets,fname){
  const fileM=monthFromName(fname);let layout=null;const per=[];
  for(const sh of sheets){
    const rows=sh.rows;let L=null,start=0;
    for(let hi=0;hi<Math.min(rows.length,40)&&!L;hi++){
      const h=rows[hi].map(normH);
      const nameC=h.findIndex(c=>/^(фио|ф\.и\.о|сотрудник|работник|фамилия)/.test(c));
      if(nameC<0)continue;
      const monthCols=[];h.forEach((c,i)=>{if(i!==nameC){const m=parseMonth(rows[hi][i]);if(m)monthCols.push([i,m])}});
      const mC=h.findIndex(c=>/^(месяц|период)/.test(c));
      const orgC=h.findIndex(c=>/^организация/.test(c));
      let sC=-1;for(const pt of [/^начисл/,/^сумма/,/^итого/,/к выплате/,/оклад/]){sC=h.findIndex((c,i)=>i!==nameC&&pt.test(c));if(sC>=0)break}
      if(!monthCols.length&&sC<0)continue;
      let titleM=null;for(let i=0;i<hi&&!titleM;i++)for(const c of rows[i])if(typeof c==='string'&&!titleM)titleM=parseMonth(c);
      L={nameC,sC,mC,orgC,monthCols,titleM};start=hi+1;
    }
    if(!L&&layout){L=layout;start=0}
    if(!L)continue;layout=L;
    const by={};
    const push=(m,org,nm,v)=>{(by[m]=by[m]||[]).push({org,name:nm,sum:v})};
    for(let i=start;i<rows.length;i++){
      const r=rows[i];if(!r)continue;const nm=String(r[L.nameC]==null?'':r[L.nameC]).trim();
      if(!nm||/^итого|^всего/i.test(nm))continue;
      const org=L.orgC>=0?String(r[L.orgC]==null?'':r[L.orgC]).trim():'';
      if(L.monthCols.length){for(const [c,m] of L.monthCols){const v=toMoney(r[c]);if(v!=null)push(m,org,nm,v)}}
      else{const v=toMoney(r[L.sC]);if(v==null)continue;const m=L.mC>=0?parseMonth(r[L.mC]):(L.titleM||fileM);if(m)push(m,org,nm,v)}
    }
    if(Object.keys(by).length)per.push({name:sh.name,by});
  }
  if(!per.length)return null;
  const byMonth={},dups=[];
  for(const sp of per)for(const [m,rows] of Object.entries(sp.by)){
    if(byMonth[m])dups.push({m,from:byMonth[m].sheet,to:sp.name});
    byMonth[m]={rows,sheet:sp.name};
  }
  return {byMonth,dups,fileName:fname};
}

/* ---------- загрузка ---------- */
async function addFiles(files,zone){
  for(const f of files){
    try{
      $('#banner').innerHTML='<div class="banner spin">Читаю файл '+esc(f.name)+'…</div>';
      await new Promise(r=>setTimeout(r,30));
      const sheets=sheetsOf(await f.arrayBuffer());
      let kind=null,sh=null;
      for(const s of sheets){const k=detectKind(s.rows);if(k){kind=k;sh=s;break}}
      if(!kind&&zone==='payroll')kind='payroll';
      if(!kind)throw new Error('Файл не похож ни на детский табель, ни на отчёт по часам, ни на таблицу руководителей групп');
      if(kind!==zone)toast('«'+f.name+'» распознан как '+({tabel:'детский табель',report:'отчёт по часам',payroll:'начисления',leaders:'руководители групп'}[kind])+' и добавлен туда');
      if(kind==='tabel'){const p=parseTabel(sh.rows,f.name);place('tabel',p)}
      else if(kind==='report'){const p=parseReport(sh.rows,f.name);place('report',p)}
      else if(kind==='leaders'){const p=parseLeaders(sh.rows,f.name);S.leaders[p.month||'0000-00']=p;toast('Руководители групп: '+Object.keys(p.map).length+' групп из «'+f.name+'»')}
      else{
        const p=parsePayroll(sheets,f.name);
        if(p){placePayroll(p)}else{S.pending={sheets,fname:f.name};openMapping();}
      }
    }catch(e){toast('Ошибка: '+f.name+' — '+e.message);console.error(e)}
  }
  render();
}
function place(kind,p){
  if(!MS.includes(p.month)){toast('«'+p.fileName+'»: месяц '+mFull(p.month)+' вне периода сентябрь 2025 — июнь 2026, файл не принят');return}
  const was=S[kind][p.month];S[kind][p.month]=p;
  if(was)toast(mFull(p.month)+': файл заменён на «'+p.fileName+'»');
}
function placePayroll(p){
  const used=[],out=[];
  for(const [m,src] of Object.entries(p.byMonth)){
    if(!MS.includes(m)){out.push(m);continue}
    S.payroll[m]={fileName:p.fileName,sheet:src.sheet,rows:src.rows,dups:p.dups.filter(d=>d.m===m)};used.push(m);
  }
  S.payrollOut=[...new Set([...(S.payrollOut||[]),...out])].sort();
  if(!used.length)toast('«'+p.fileName+'»: нет месяцев из периода сентябрь 2025 — июнь 2026');
}
function allOrgs(){const o=new Set();Object.values(S.payroll).forEach(x=>x.rows.forEach(r=>{if(r.org)o.add(r.org)}));return o}
function removeFile(kind,m){if(m.startsWith('F:')){const f=m.slice(2);Object.keys(S.payroll).forEach(k=>{if(S.payroll[k].fileName===f)delete S.payroll[k]});}else delete S[kind][m];render()}

/* ---------- расчёт ---------- */
function compute(){
  const months=MS.filter(m=>m!==EXCLUDED_MONTH&&S.tabel[m]&&S.report[m]);
  const payMap={};let otherOrgSum=0;
  for(const [m,src] of Object.entries(S.payroll)){
    const map=new Map();
    for(const r of src.rows){
      const k=canon(r.name);const e=map.get(k)||{sum:0,names:[]};e.sum+=r.sum;if(!e.names.includes(r.name.trim()))e.names.push(r.name.trim());map.set(k,e);
    }
    payMap[m]={map,fileName:src.fileName};
  }
  const G={};const gget=g=>G[g]||(G[g]={g,child:0,reg:0,regCov:0,alloc:0,bm:{},names:new Set()});
  const gm=(g,m)=>{const x=gget(g);return x.bm[m]||(x.bm[m]={child:0,reg:0,regCov:0,alloc:0})};
  const dist=[],checks=[{lvl:'info',sec:'Период',month:EXCLUDED_MONTH,text:'Октябрь 2025 исключён из расчёта',detail:'Отсутствует корректный детский табель; октябрьские часы и начисления не используются.'}],excl={},unmatched=[],empMonth=[];
  const add=(lvl,sec,month,text,detail)=>checks.push({lvl,sec,month,text,detail:detail||''});
  const seenNames=new Map(),allRepKeys=new Set(),allCodes=new Set();
  for(const m of months){
    const T=S.tabel[m],R=S.report[m],P=payMap[m];
    for(const r of T.rows){
      const cls=classify(r.group);const mins=S.opts.subRG?r.tot:r.ds;allCodes.add(r.group);
      if(cls==='regular'){gm(r.group,m).child+=mins/60}
      else{const k=cls+'|'+m;(excl[k]=excl[k]||{cls,m,child:0,rep:0}).child+=mins/60}
    }
    const E={};
    for(const r of R.rows){
      if(!(r.hrs>0))continue;
      allCodes.add(r.code);
      const key=repKey(r.fio);allRepKeys.add(key);
      if(!seenNames.has(key))seenNames.set(key,new Set());seenNames.get(key).add(r.fio);
      const e=E[key]||(E[key]={key,name:r.fio,tot:0,okp:0,standalone:0,regByG:{}});
      e.tot+=r.hrs;
      const cls=classify(r.code);
      if(cls==='okped')e.okp+=r.hrs;
      if(r.type==='CNS'||cls==='amb'||cls==='g05'||cls==='primary')e.standalone+=r.hrs;
      if(r.type==='CNS'||cls!=='regular'){
        if(cls!=='regular'){const k=cls+'|'+m;(excl[k]=excl[k]||{cls,m,child:0,rep:0}).rep+=r.hrs}
        continue;
      }
      e.regByG[r.code]=(e.regByG[r.code]||0)+r.hrs;
    }
    for(const e of Object.values(E)){
      const volunteer=isVolunteer(e.key,e.name);const pe=volunteer?null:(P?P.map.get(e.key):null);const pay=volunteer?0:(pe?pe.sum:null);
      let regT=0,allocT=0;
      for(const [g,reg] of Object.entries(e.regByG)){
        // Preparation and supporting time is absorbed into delivery; standalone services retain their share.
        const direct=Object.values(e.regByG).reduce((a,h)=>a+h,0);
        const den=direct+e.standalone;const share=den>0?reg/den:0;const alloc=pay==null?null:pay*share;
        regT+=reg;if(alloc!=null)allocT+=alloc;
        const b=gm(g,m);b.reg+=reg;if(pay!=null){b.regCov+=reg;b.alloc+=alloc}
        gget(g).names.add(e.name);
        dist.push({m,g,key:e.key,name:e.name,tot:den,reg,share,pay,alloc});
      }
      empMonth.push({m,key:e.key,name:e.name,tot:e.tot,regT,pay,allocT,hasPay:pay!=null});
      if(pay==null&&regT>0){const relevant=Object.entries(e.regByG).filter(([g])=>!NON_CHILD_GROUPS.has(g)).reduce((sum,[,h])=>sum+h,0);if(relevant>0)unmatched.push({m,key:e.key,name:e.name,regT:relevant,tot:e.tot,noMonth:!P});}
    }
  }
  const leaderOf={};
  Object.keys(S.leaders).sort().forEach(m=>{for(const [c,n] of Object.entries(S.leaders[m].map)){const a=leaderOf[c]||(leaderOf[c]=[]);if(!a.includes(n))a.push(n)}});
  const groups=[];
  if(S.period!=='all'&&!months.includes(S.period))S.period='all';
  const selM=S.period==='all'?months:[S.period];
  for(const x of Object.values(G)){
    const bmAll=x.bm;x.bm=Object.fromEntries(Object.entries(bmAll).filter(([m])=>selM.includes(m)));
    if(!Object.keys(x.bm).length)continue;
    for(const b of Object.values(x.bm)){x.child+=b.child;x.reg+=b.reg;x.regCov+=b.regCov;x.alloc+=b.alloc}
    const perM={};for(const m of months){const b=bmAll[m];if(!b)continue;perM[m]={child:b.child,alloc:b.alloc,cost:(b.child>0&&b.reg>0)?b.alloc/b.child:null,ok:b.child>0&&b.reg>0&&b.reg<=b.regCov+1e-9}}
    const reasons=[];
    const noPayM=NON_CHILD_GROUPS.has(x.g)?[]:Object.entries(x.bm).filter(([m,b])=>b.reg>b.regCov+1e-9).map(([m])=>m);
    const noRepM=Object.entries(x.bm).filter(([m,b])=>b.child>0&&b.reg===0).map(([m])=>m);
    const noChM=Object.entries(x.bm).filter(([m,b])=>b.reg>0&&b.child===0).map(([m])=>m);
    let status,kind;
    if(x.child<=0){status='Нет детских часов';kind='info';reasons.push('В табеле нет часов этой группы')}
    else if(x.reg<=0){status='Нет часов занятий в отчёте';kind='info';reasons.push('В отчёте по часам нет регулярных занятий этой группы')}
    else{
      if(noPayM.length)reasons.push('Не сопоставлены начисления за: '+noPayM.map(mShort).join(', '));
      if(noRepM.length)reasons.push('Нет часов занятий в отчёте: '+noRepM.map(mShort).join(', '));
      if(noChM.length)reasons.push('Нет детских часов в табеле: '+noChM.map(mShort).join(', '));
      if(reasons.length){status='Неполно';kind='warn'}else{status='Рассчитано';kind='ok'}
    }
    const nB=Object.keys(x.bm).length,per=n=>nB>1?': '+n+' из '+nB+' мес.':'';
    const whyA=[];
    if(x.child>0&&x.reg>0){
      if(noPayM.length)whyA.push('нет сопоставленных начислений за '+noPayM.map(mShort).join(', '));
      if(noRepM.length)whyA.push('нет часов занятий в отчёте'+per(noRepM.length));
      if(noChM.length)whyA.push('нет детских часов в табеле'+per(noChM.length));
    }else whyA.push(...reasons);
    const why=whyA.join('; ');
    const cover=x.reg>0?x.regCov/x.reg:null;
    const cost=(x.child>0&&x.reg>0)?x.alloc/x.child:null;
    if(NON_CHILD_GROUPS.has(x.g)){status='Отдельно';kind='info';reasons.length=0;reasons.push('Не детская группа, не участвует в среднем')}else if(SEP.has(x.g)&&kind==='ok'){status='Отдельно';kind='info';reasons.push('Показана отдельно, в среднее не входит')}
    groups.push({leader:(leaderOf[x.g]||[]).join(', '),why,perM,g:x.g,child:x.child,alloc:x.alloc,cost,cover,reg:x.reg,nMonths:Object.keys(x.bm).length,status,kind,reasons,isSep:NON_CHILD_GROUPS.has(x.g)||SEP.has(x.g),teachers:x.names.size});
  }
  groups.sort((a,b)=>(a.isSep-b.isSep)||a.g.localeCompare(b.g,'ru',{numeric:true}));
  // проверки
  for(const m of MS){
    if(m===EXCLUDED_MONTH)continue;
    const t=!!S.tabel[m],r=!!S.report[m],p=!!S.payroll[m];
    if((t||r)&&!(t&&r))add('warn','Месяцы',m,'Месяц не входит в расчёт: нет '+(!t?'детского табеля':'')+(!t&&!r?' и ':'')+(!r?'отчёта по часам':''));
    if(t&&r&&!p&&S.report[m].rows.some(x=>x.hrs>0&&classify(x.code)==='regular'&&!NON_CHILD_GROUPS.has(x.code)&&!isVolunteer(repKey(x.fio),x.fio)))add('err','Месяцы',m,'Нет начислений РОУ за месяц','Стоимость за этот месяц нельзя считать установленной.');
  }
  if(!Object.keys(S.payroll).length&&months.length)add('err','Начисления',null,'Файл начислений не загружен','Без начислений стоимость часа не считается.');
  for(const m of Object.keys(S.tabel)){
    const T=S.tabel[m];
    if(T.control!=null){const s=T.rows.reduce((a,r)=>a+r.tot,0);
      if(Math.abs(s-T.control)>1)add('err','Детский табель',m,'Сумма минут в строках не совпадает с итогом файла','Строки: '+fmt(s,0)+', итог в файле: '+fmt(T.control,0)+'. Возможно, выгрузка неполная.');
      else add('ok','Детский табель',m,'Итог файла сходится с суммой строк','('+fmt(s,0)+' мин)')}
    if(T.bad.noName||T.bad.noGroup)add('warn','Детский табель',m,'Строки с пустыми значениями','Без ФИО ребёнка: '+T.bad.noName+', без группы: '+T.bad.noGroup);
  }
  for(const m of Object.keys(S.report)){
    const R=S.report[m];
    if(R.control&&R.control.fact!=null){
      if(Math.abs(R.sumFact-R.control.fact)>1)add('err','Отчёт по часам',m,'Сумма минут (факт) не совпадает с итогом файла','Строки: '+fmt(R.sumFact,0)+', итог в файле: '+fmt(R.control.fact,0)+'. Возможно, выгрузка неполная.');
      else add('ok','Отчёт по часам',m,'Итог файла сходится с суммой строк','('+fmt(R.sumFact,0)+' мин факт)')}
    else add('warn','Отчёт по часам',m,'В файле нет итоговой строки «Всего минут», полноту выгрузки проверить нельзя');
    if(R.outOfMonth)add('warn','Отчёт по часам',m,'Строки с датами другого месяца не учтены: '+R.outOfMonth);
    const b=R.bad;

  }
  // группы только в одном файле
  for(const m of months){
    const tg=new Set(S.tabel[m].rows.map(r=>r.group).filter(g=>classify(g)==='regular'));
    const rg=new Set(S.report[m].rows.filter(r=>r.hrs>0&&r.type!=='CNS'&&classify(r.code)==='regular').map(r=>r.code));
    const a=[...tg].filter(g=>!NON_CHILD_GROUPS.has(g)&&!rg.has(g)&&G[g]&&G[g].bm[m]&&G[g].bm[m].child>0),b=[...rg].filter(g=>!NON_CHILD_GROUPS.has(g)&&!tg.has(g));
    if(a.length)add('warn','Группы',m,'Есть в табеле, нет занятий в отчёте по часам',a.join(', '));
    if(b.length)add('warn','Группы',m,'Есть в отчёте по часам, нет детей в табеле',b.join(', '));
  }
  for(const g of allCodes)if(/^[А-Я]+$/.test(g)&&classify(g)==='regular')add('info','Коды групп',null,'Код «'+g+'» в ТЗ не описан, считается обычной группой'+(g==='БК'?' и выводится отдельно':''));
  for(const e of Object.values(excl)){
    add('info','Исключено из стоимости',e.m,CLS_NAME[e.cls],'Детские часы: '+fmt(e.child)+', часы педагогов в отчёте: '+fmt(e.rep)+(e.cls==='amb'||e.cls==='okped'||e.cls==='g05'||e.cls==='primary'?' (эти часы остаются в общем времени сотрудника)':''));
  }
  // начисления
  const uniq=new Map();unmatched.forEach(u=>{const o=uniq.get(u.key)||{name:u.name,key:u.key,ms:[],h:0};o.ms.push(u.m);o.h+=u.regT;uniq.set(u.key,o)});
  const unmatchedList=[...uniq.values()];
  const payM=Object.keys(payMap);
  if(payM.length)for(const u of unmatchedList)for(const m of u.ms){const one=unmatched.find(x=>x.key===u.key&&x.m===m);add('err','Начисления',m,'Не найдены начисления за '+mFull(m)+': '+u.name,'В отчёте есть '+fmt(one?one.regT:0)+' ч занятий. Проверьте начисления за этот месяц и написание ФИО.');}
  const repAny=new Set(allRepKeys);
  const payOnly=[];
  for(const m of months){const P=payMap[m];if(!P)continue;for(const [k,v] of P.map)if(!repAny.has(k)&&!payOnly.some(p=>p.key===k))payOnly.push({key:k,name:v.names[0]})}
  if(payOnly.length)add('info','Начисления',null,'Сотрудники из начислений без часов в отчёте: '+payOnly.length,payOnly.slice(0,40).map(p=>p.name).join('; ')+(payOnly.length>40?'…':''));
  // алиасы
  for(const g of ALIASES){
    const keyC=nk(g[0]);const inRep=[...allRepKeys].includes(keyC);let inPay=false;for(const m of payM)if(payMap[m].map.has(keyC))inPay=true;
    if(inRep||inPay)add(inRep&&inPay?'ok':'info','Сопоставление ФИО',null,g.join(' = '),inRep&&inPay?'Совпало в отчёте и в начислениях':(inRep?'Есть в отчёте, в начислениях не найдено':'Есть в начислениях, в отчёте не найдено'));
  }
  const bit=[...seenNames.values()].flatMap(s=>[...s]).filter(n=>/^Битова/i.test(n));
  if(new Set(bit.map(nk)).size>1)add('info','Сопоставление ФИО',null,'Битова А. Л. и Битова В. А. — разные сотрудники','Не объединены.');
  if(allOrgs().size)add('info','Начисления',null,'Начисления всех организаций суммируются: '+[...allOrgs()].sort().join(', '),'Если сотрудник получает деньги в нескольких организациях, суммы складываются по сотруднику.');
  if(S.payrollOut.length)add('info','Начисления',null,'Месяцы вне периода в файле начислений не использованы: '+S.payrollOut.map(mShort).join(', '));
  for(const [m,src] of Object.entries(S.payroll)){
    if(src.dups&&src.dups.length)add('info','Начисления',m,'Месяц есть на нескольких листах файла начислений, взят лист «'+src.dups[0].to+'»','Строки не складываются, чтобы начисления не задвоились.');
    const neg=src.rows.filter(r=>r.sum<0);
    if(neg.length)add('warn','Начисления',m,'Отрицательные начисления: '+neg.length,neg.map(r=>r.name.trim()+' '+money(r.sum)).join('; ')+'. Они вычтены из суммы сотрудника.');
  }
  if(Object.keys(S.leaders).length){
    const lm=Object.keys(S.leaders).sort().filter(m=>m!=='0000-00').map(mShort).join(', ');
    add('info','Руководители групп',null,'Руководители взяты из файла распределения часов'+(lm?' за: '+lm:''),'Для остальных месяцев показан тот же состав. Если руководитель группы менялся, загрузите файл за нужный месяц.');
    const noL=groups.filter(g=>!g.isSep&&!g.leader).map(g=>g.g);
    if(noL.length)add('warn','Руководители групп',null,'Руководитель не найден для групп: '+noL.join(', '));
    const pk=new Set();Object.values(S.leaders).forEach(l=>Object.values(l.map).forEach(n=>pk.add(n)));
  }

  let viol=0;for(const e of empMonth)if(e.hasPay&&e.allocT>e.pay+0.005)viol++;
  if(empMonth.length){if(viol)add('err','Распределение',null,'Отнесено больше, чем начислено у '+viol+' сотрудников','Проверьте часы в отчёте по часам.');else add('ok','Распределение',null,'Отнесённые начисления не превышают начисления ни у одного сотрудника','Проверено сотрудник-месяцев: '+empMonth.length)}

  return {months,selM,groups,dist,checks,unmatchedList,payOnly,payMap,summary:{sumPay,sumAlloc},empMonth};
}

async function saveFile(buf,name){
  try{const dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null);
    if(dl){await dl.save({filename:name,data:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});toast('Файл подготовлен: '+name);return}}
  catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/octet-stream'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
